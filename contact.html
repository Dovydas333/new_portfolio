<main>
    <section class="contact-page">
        <div class="container contact-content">
            <div class="contact-info">
                <span class="status">Get in touch</span>
                <h1>Let's work together</h1>
                <p>
                    Have a project in mind, a question, or just want to
                    connect? Fill out the form or contact me directly.
                </p>
                <div class="contact-details">
                    <div>
                        <span>Email</span>
                        <a href="mailto:valandovydas@gmail.com">
                            valandovydas@gmail.com
                        </a>
                    </div>
                    <div>
                        <span>GitHub</span>
                        <a href="https://github.com/Dovydas333" target="_blank" rel="noopener noreferrer">
                            github.com/Dovydas333
                        </a>
                    </div>
                </div>
            </div>

            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What is this about?" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="7" placeholder="Write your message here..." required></textarea>

                <button type="submit" class="button primary">
                    Send Message
                </button>
            </form>
        </div>
    </section>
</main>
